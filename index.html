<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fbf6f0">
<title>Your Date, Your Rules 🙃</title>
<meta name="description" content="A little date invitation, made just for you ❤️">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');
:root{--cream:#fbf6f0;--ink:#34252a;--wine:#7e3549;--pink:#eebcc2;--line:#e9d9d8;--muted:#826f75;--white:#fffdfb;--highlight:#fff0f0}*{box-sizing:border-box}html{min-height:100%;background:var(--cream)}body{margin:0;min-height:100vh;color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;overflow-x:hidden;background:radial-gradient(circle at 7% 10%,#fae5e7 0,transparent 27%),radial-gradient(circle at 96% 88%,#fae2dd 0,transparent 26%),var(--cream)}body:before{content:'✳';position:fixed;top:10vh;left:6vw;font-size:32px;color:#e7a4b0;opacity:.5;transform:rotate(25deg)}body:after{content:'✧';position:fixed;bottom:7vh;right:8vw;font-size:45px;color:#dba2ac;opacity:.5}main{max-width:540px;margin:0 auto;padding:38px 20px 36px;min-height:100vh;display:flex;align-items:center;justify-content:center}.app{width:100%;position:relative}.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:0 8px;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}.heartlogo{font-size:22px;letter-spacing:0;color:var(--wine)}.shell{position:relative;background:rgba(255,253,251,.95);border:1px solid rgba(202,154,161,.45);border-radius:27px;padding:34px 30px 26px;box-shadow:0 22px 72px rgba(110,54,68,.10),0 4px 12px rgba(88,44,56,.04);overflow:hidden;min-height:570px}.shell:before{content:'';display:block;position:absolute;height:6px;left:0;right:0;top:0;background:linear-gradient(90deg,#d88b9e,#e6b8a4,#d88b9e)}.tiny{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#b47184;font-weight:700;margin-bottom:18px}.hero{font-size:55px;line-height:1.05;margin:0 0 17px;letter-spacing:-.04em;font-weight:500;font-family:'Playfair Display',Georgia,serif}.hero em{color:var(--wine);font-weight:500}.hero.small{font-size:40px}.subtitle{color:var(--muted);font-size:15px;line-height:1.75;margin-bottom:24px}.subtitle strong{color:var(--ink)}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--wine);text-transform:uppercase;margin-bottom:16px}.question{font-family:'Playfair Display',Georgia,serif;font-size:34px;line-height:1.23;letter-spacing:-.025em;font-weight:500;margin:0 0 26px}.options{display:flex;flex-direction:column;gap:11px}.option{width:100%;background:#fff;border:1.5px solid #ecdcda;border-radius:15px;padding:18px 17px;min-height:59px;display:flex;align-items:center;gap:12px;color:var(--ink);font-family:inherit;text-align:left;font-size:15px;font-weight:600;line-height:1.4;cursor:pointer;transition:all .2s}.option:hover{border-color:#d8a0ad;background:#fff8f8;transform:translateY(-1px)}.option.selected{background:#fff2f3;border-color:var(--wine);box-shadow:0 0 0 1px var(--wine)}.option .emoji{font-size:22px;flex-shrink:0}.circle{margin-left:auto;flex-shrink:0;display:grid;place-items:center;width:20px;height:20px;border-radius:100%;border:1.5px solid #d4b2b7;font-size:12px;color:white}.selected .circle{background:var(--wine);border-color:var(--wine)}.progress{display:flex;gap:5px;margin-bottom:33px}.bar{height:4px;flex:1;border-radius:5px;background:#f2e1e2}.bar.done{background:#c47f92}.nav{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:30px}.btn{font:700 14px 'DM Sans',sans-serif;border:0;border-radius:100px;padding:16px 26px;cursor:pointer;transition:transform .2s,background .2s}.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(1px)}.primary{background:var(--wine);color:#fff;flex:1}.primary:hover{background:#69283b}.primary:disabled{background:#d6bfc5;cursor:not-allowed;transform:none}.ghost{background:transparent;color:#7d6b71;padding-left:8px;padding-right:8px}.secondary{background:#f7e6e9;color:var(--wine)}.single-btn{width:100%;margin-top:18px}.foot{text-align:center;color:#a18c90;font-size:12px;margin-top:17px}.welcome-heart{font-size:67px;margin:26px 0 24px;display:block;filter:drop-shadow(0 8px 8px rgba(165,60,86,.12));animation:pop 2.4s ease-in-out infinite}.float{position:absolute;pointer-events:none;opacity:.25;font-size:29px}.float.a{right:32px;top:88px;transform:rotate(15deg)}.float.b{right:70px;bottom:120px;transform:rotate(-20deg)}.special{font-family:'Playfair Display',Georgia,serif;font-size:22px;line-height:1.4;font-style:italic;color:var(--wine);margin:14px 0 22px}.note{font-size:13px;color:var(--muted);line-height:1.55;margin:15px 0 0}.summary{padding:18px;background:#fff7f6;border:1px solid #ecd9d9;border-radius:17px;margin:20px 0 14px}.summaryline{display:flex;flex-direction:column;gap:3px;padding:9px 0;border-bottom:1px solid #eedcdb}.summaryline:last-child{border:0}.summaryline .key{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}.summaryline .value{font-size:14px;font-weight:600;line-height:1.5}.final-title{text-align:center;font-family:'Playfair Display',Georgia,serif;font-size:34px;line-height:1.18;font-weight:500;margin:7px 0}.final-desc{text-align:center;color:var(--wine);font-size:16px;margin:14px 0 19px}.final-top{text-align:center;font-size:49px;margin:13px 0 9px}.footer-buttons{display:flex;flex-direction:column;gap:9px}.copied{margin:0;text-align:center;font-size:13px;color:var(--wine);min-height:21px}.text-field{width:100%;margin-top:12px;padding:13px 15px;border:1.5px solid #e1c4cb;border-radius:12px;background:white;font:inherit;font-size:15px;color:var(--ink);outline:0}.text-field:focus{border-color:var(--wine);box-shadow:0 0 0 3px #eed6dc}.hidden{display:none!important}.screen{animation:fadeSlide .32s ease both}.hint{background:#fff4f2;padding:12px 15px;border-radius:12px;color:#794459;font-size:13px;margin:15px 0 0;line-height:1.4}.confetti{pointer-events:none;position:absolute;inset:0;overflow:hidden}.confetti span{position:absolute;top:-35px;animation:fall 2.5s forwards;opacity:.75}.bottom-left{position:absolute;bottom:15px;left:30px;color:#d1a1aa;font-size:10px;letter-spacing:.1em;text-transform:uppercase}@keyframes fall{0%{transform:translateY(-35px) rotate(0deg);opacity:0}15%{opacity:.85}100%{transform:translateY(650px) rotate(180deg);opacity:0}}@keyframes fadeSlide{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:translateY(0)}}@keyframes pop{50%{transform:scale(1.07)}}@media(max-width:490px){main{padding:18px 14px}.shell{padding:29px 22px 24px;min-height:550px}.question{font-size:30px}.hero{font-size:46px}.hero.small{font-size:35px}.option{padding:15px;font-size:14px}.topline{padding:0 5px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main><div class="app"><div class="topline"><span>JUST FOR YOU, LARA</span><span class="heartlogo">♡</span></div><section class="shell" id="app" aria-live="polite"></section><p class="foot">Made with a little love and questionable coding skills 🙃</p></div></main>
<script>
'use strict';
/* Optional: set recipientNumber to a phone number in international digits ONLY, no + sign.
   If blank, WhatsApp opens a contact chooser and Lara selects the recipient herself.
   Important: a public GitHub Pages site exposes this value in its HTML source.
*/
const CONFIG = {recipientNumber: ''};
const questions = [
  {title:'What are you most excited about? 🙃',options:[
    ['🥰','Catching up! It\'s been a while!'],
    ['❤️','You making me feel special... because nobody does it better than you 😉'],
    ['😛','Getting flirty and a little cheesy'],
    ['😍','All of the above!']
  ]},
  {title:'What are we drinking? 🍷🙃',options:[
    ['🍺','A beer!'],['🍷','Wine!'],['🍷','Glühwein 🤞🏻🤞🏻'],['🥛','Eggnog! (I\'ll need your recipe!!) 😛']
  ]},
  {title:'What\'s the dress code? 🙃',options:[
    ['🥰','Cozy and comfy!'],['😏','Dress up! I haven\'t seen you in a dress shirt before 👀']
  ]},
  {title:'When can I steal you for a date? 😘',options:[
    ['❤️','Tuesday evening (November 3)'],['🥰','Wednesday evening (November 4)'],['🙃','None of these work? Suggest another time ❤️']
  ]}
];
let stage=-1;
const answers=[null,null,null,null];
let otherTime='';
let copyStatus='';
const app=document.getElementById('app');
const escapeHTML=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function progress(n){return `<div class="progress" aria-label="Question ${n} of 4">${Array.from({length:4},(_,i)=>`<div class="bar ${i<n?'done':''}"></div>`).join('')}</div>`;}
function navigate(i){stage=i;copyStatus='';render();window.scrollTo({top:0,behavior:'smooth'});}
function reaction(){if(stage===1&&answers[1]===2)return 'Excellent choice! 🤞🏻😂';if(stage===1&&answers[1]===3)return 'You better send me that recipe! 😛';if(stage===2&&answers[2]===1)return 'Ohhh, now I\'m excited! 👀';if(stage===0&&answers[0]===3)return 'Very good answer. Very good. 😏❤️';return '';}
function render(){
  if(stage===-1){app.innerHTML=`<div class="screen"><span class="float a">✦</span><span class="float b">♡</span><div class="eyebrow">A VERY SPECIAL INVITATION</div><span class="welcome-heart" aria-hidden="true">💌</span><h1 class="hero">Your Date,<br><em>Your Rules.</em> 🙃</h1><p class="subtitle"><strong>Hey gorgeous ❤️</strong><br><br>You've been invited on a date with me!<br><br>But this time... you make the rules! 😛</p><button class="btn primary single-btn" id="start">Let's go! ❤️</button><p class="foot">4 little questions · about 1 minute</p></div>`;document.getElementById('start').onclick=()=>navigate(0);return;}
  if(stage===4){renderFinal();return;}
  const q=questions[stage];
  app.innerHTML=`<div class="screen">${progress(stage+1)}<div class="eyebrow">QUESTION ${stage+1} OF 4</div><h2 class="question">${escapeHTML(q.title)}</h2><div class="options" role="radiogroup" aria-label="${escapeHTML(q.title)}">${q.options.map(([emoji,label],i)=>`<button type="button" class="option ${answers[stage]===i?'selected':''}" role="radio" aria-checked="${answers[stage]===i}" data-opt="${i}"><span class="emoji">${emoji}</span><span>${escapeHTML(label)}</span><span class="circle" aria-hidden="true">${answers[stage]===i?'✓':''}</span></button>`).join('')}</div>${stage===3&&answers[3]===2?`<label for="othertime" class="note" style="display:block">What day or time works better for you?</label><input id="othertime" class="text-field" type="text" maxlength="160" placeholder="Your suggestion..." value="${escapeHTML(otherTime)}" aria-label="Suggest another date or time">`:''}${reaction()?`<div class="hint" role="status">${escapeHTML(reaction())}</div>`:''}<div class="nav"><button class="btn ghost" id="back">← Back</button><button class="btn primary" id="next" ${answers[stage]===null||(stage===3&&answers[3]===2&&!otherTime.trim())?'disabled':''}>${stage===3?'See our date →':'Next →'}</button></div></div>`;
  document.querySelectorAll('[data-opt]').forEach(btn=>btn.onclick=()=>{answers[stage]=Number(btn.dataset.opt);render()});
  document.getElementById('back').onclick=()=>navigate(stage-1);
  document.getElementById('next').onclick=()=>navigate(stage+1);
  const input=document.getElementById('othertime');if(input)input.oninput=()=>{otherTime=input.value;document.getElementById('next').disabled=!otherTime.trim()};
}
function chosen(i){if(answers[i]===null)return '';return questions[i].options[answers[i]][0]+' '+questions[i].options[answers[i]][1]}
function when(){return answers[3]===2?`Another time: ${otherTime}`:chosen(3).replace(' (November 3)',' (Nov 3, Denmark time)').replace(' (November 4)',' (Nov 4, Denmark time)')}
function textMessage(){return `Hey you 😘\n\nHere's our date!\n\n🥰 Looking forward to: ${questions[0].options[answers[0]][1]}\n🍷 Drinks: ${questions[1].options[answers[1]][1]}\n👕 Dress code: ${questions[2].options[answers[2]][1]}\n📅 When: ${answers[3]===2?'Another time: '+otherTime:questions[3].options[answers[3]][1]+' (Denmark time)'}\n\nSee you soon! ❤️`}
function confetti(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const div=document.createElement('div');div.className='confetti';for(let i=0;i<18;i++){let s=document.createElement('span');s.textContent=['♥','✦','♡','✳'][i%4];s.style.left=(Math.random()*96)+'%';s.style.animationDelay=(Math.random()*0.8)+'s';s.style.color=['#b86a83','#d8a69f','#dc819a'][i%3];s.style.fontSize=(10+Math.random()*18)+'px';div.append(s)}app.append(div);setTimeout(()=>div.remove(),4000)}
function renderFinal(){
const labels=['Looking forward to','Drinks','Dress code','When'];const vals=[chosen(0),chosen(1),chosen(2),when()];
app.innerHTML=`<div class="screen"><div class="final-top">💌</div><h1 class="final-title">Well well well... 😏<br><span style="color:var(--wine)">Looks like we're having a date! ❤️</span></h1><p class="final-desc">And I'm already smiling 🙃</p><div class="summary">${labels.map((l,i)=>`<div class="summaryline"><span class="key">${l}</span><span class="value">${escapeHTML(vals[i])}</span></div>`).join('')}</div><p class="special" style="text-align:center">One last thing...</p><p class="subtitle" style="text-align:center;margin-top:-13px;margin-bottom:22px">I promise to behave... well, I'll try 😛</p><div class="footer-buttons"><button class="btn primary" id="whatsapp">Send me our date 💌</button><button class="btn secondary" id="copy">Copy instead 📋</button><button class="btn ghost" id="edit">← Change my choices</button></div><p id="copy-status" class="copied" role="status"></p><p class="note" style="text-align:center">This sends me your date request. We'll confirm the exact time together. ❤️</p></div>`;
  document.getElementById('whatsapp').onclick=()=>{const n=CONFIG.recipientNumber.replace(/\D/g,'');const msg=encodeURIComponent(textMessage());const url=n?`https://wa.me/${n}?text=${msg}`:`https://api.whatsapp.com/send?text=${msg}`;window.location.href=url};
  document.getElementById('copy').onclick=copy;
  document.getElementById('edit').onclick=()=>navigate(3);
  if(!sessionStorage.getItem('celebrated')){confetti();sessionStorage.setItem('celebrated','1')}
}
async function copy(){const text=textMessage();const status=document.getElementById('copy-status');try{await navigator.clipboard.writeText(text);status.textContent='Copied! Paste it in WhatsApp ❤️'}catch(e){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;opacity:0;left:-9999px';document.body.appendChild(area);area.select();try{document.execCommand('copy');status.textContent='Copied! Paste it in WhatsApp ❤️'}catch(err){status.textContent='Select and copy the message below';const manual=document.createElement('textarea');manual.value=text;manual.className='text-field';manual.rows=8;status.insertAdjacentElement('afterend',manual);manual.select()}area.remove()}}
render();
</script>
</body>
</html>
